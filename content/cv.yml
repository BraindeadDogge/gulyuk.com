profile:
  name: Grigory Gulyuk
  headline: Software engineer, AI tooling and full-stack products
  location: Paphos, Cyprus
  summary: >-
    Software engineer working on AI tooling and full-stack products. Until October 2026 I was a software
    engineer intern at JetBrains, on MCP Steroid, an official JetBrains incubator project that connects AI
    coding agents such as Claude Code, Codex and Gemini to JetBrains IDEs through the Model Context Protocol.
    My work there spanned the IntelliJ Platform plugin, the Kotlin-based devrig CLI and MCP server,
    cross-platform installation flows and automated testing.
    Alongside it I work as the full-stack engineer at Soqra, an AI-powered platform for mathematics education:
    a real-time backend with FastAPI, Python and PostgreSQL, and a frontend with Nuxt 4, Vue 3 and TypeScript.
    I study Computer Science and Artificial Intelligence at Neapolis University Pafos, in a program designed
    and delivered by JetBrains. I like working close to the product, where backend architecture, developer
    tooling, AI systems and user experience come together, and I am looking for my next internship.

        label: Living in Cyprus
        about: Daily life on the island.
      - id: relocation
        label: Moving & paperwork
        about: Visas, permits, registration and bureaucracy.
      - id: travel
        label: Travel
        about: Trips, places and practical tips.
      - id: food
